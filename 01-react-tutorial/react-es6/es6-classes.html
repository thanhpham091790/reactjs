<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
</head>

<body>
    <h1>Example</h1>

    <p>Without using template strings:</p>

    <pre id="demo"></pre>

    <script>
        const price = 10;
        const quantity = 5;
        let total = `Total: $${price * quantity}`;

        document.querySelector('#demo').innerHTML = total;
    </script>
</body>

</html>
