<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
</head>

<body>
    <h1 id="demo"></h1>

    <script>
        let authenticated = true;

        authenticated ? renderApp() : renderLogin();

        function renderApp() {
            document.querySelector('#demo').innerHTML = 'Welcome!';
        }

        function renderLogin() {
            document.querySelector('#demo').innerHTML = 'Please log in!';
        }
    </script>
</body>

</html>
