<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
</head>

<body>
    <h1>Example</h1>

    <p>You can use the Array.map() function inside a template string:</p>

    <div id="demo"></div>


    <script>
        const items = ["apple", "banana", "orange"];
        const list =
            `You have ${items.length} items:
            ${items.map(item => item).join(' | ')}
        `;

        document.querySelector('#demo').innerHTML = list;
    </script>
</body>

</html>
