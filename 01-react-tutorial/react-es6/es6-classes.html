<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
</head>

<body>
    <h1>Example</h1>

    <p>You can use the Array.map() function inside a template string:</p>

    <div id="demo"></div>


    <script>
        const isAdmin = true;
        const message = `Status: ${isAdmin ? 'Admin' : 'User'}`;

        document.querySelector('#demo').innerHTML = message;
    </script>
</body>

</html>
