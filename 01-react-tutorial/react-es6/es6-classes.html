<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
</head>

<body>
    <h1>Example</h1>

    <p>Without using template strings:</p>

    <div id="demo"></div>

    <script>
        const html = `
            <div>
                <h1>Title</h1>
                <p>Paragraph</p>
            </div>
        `;

        document.querySelector('#demo').innerHTML = html;
    </script>
</body>

</html>
